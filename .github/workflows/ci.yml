name: scientific-integrity

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - run: python -m pip install uv==0.9.8
      - run: uv sync --frozen --extra test --extra baseline
      - run: test "$(git tag --list 'dvg-obs-*' | wc -l | tr -d ' ')" -gt 0
      - run: uv run python tools/check_isolation.py
      - run: uv run python -m pytest -q
      - run: uv run dvg-obs-v5-release-audit
