[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvg-obs-ceo"
version = "0.1.0.dev0"
description = "Independent DVG-aware OBS compression research extension for CEO-ADAPT-VQE"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "jsonschema==4.23.0",
  "numpy==1.23.5",
  "scipy==1.10.1",
]

[project.optional-dependencies]
baseline = [
  "openfermion==1.5.1",
  "openfermionpyscf==0.5",
  "pyscf==2.2.0",
  "qiskit==0.43.3",
]
test = [
  "pytest==8.3.5",
]
calibration = [
  "matplotlib==3.10.9",
]

[project.scripts]
dvg-obs-baseline = "dvg_obs_ceo.baseline:main"
dvg-obs-parity = "dvg_obs_ceo.parity:main"
dvg-obs-s4-probe = "dvg_obs_ceo.s4_probe:main"
dvg-obs-s5-probe = "dvg_obs_ceo.s5_probe:main"
dvg-obs-s6-probe = "dvg_obs_ceo.s6_probe:main"
dvg-obs-s7-probe = "dvg_obs_ceo.s7_probe:main"
dvg-obs-s8-probe = "dvg_obs_ceo.s8_probe:main"
dvg-obs-s8-audit = "dvg_obs_ceo.s8_audit:main"
dvg-obs-s8-extension-probe = "dvg_obs_ceo.s8_extension_probe:main"
dvg-obs-s9-probe = "dvg_obs_ceo.s9_probe:main"
dvg-obs-s10-lih = "dvg_obs_ceo.s10_lih:main"
dvg-obs-s10-audit = "dvg_obs_ceo.s10_audit:main"
dvg-obs-s11-gsd = "dvg_obs_ceo.s11_gsd:main"
dvg-obs-s11-compare = "dvg_obs_ceo.s11_compare:main"
dvg-obs-s12-reuse-probe = "dvg_obs_ceo.s12_reuse_probe:main"
dvg-obs-s12-audit = "dvg_obs_ceo.s12_audit:main"
dvg-obs-v3-protocol = "dvg_obs_ceo.v3_protocol:main"
dvg-obs-v3-gradient-audit = "dvg_obs_ceo.v3_gradient_audit:main"
dvg-obs-v3-gradient-result-audit = "dvg_obs_ceo.v3_gradient_result_audit:main"
dvg-obs-v3-polishing-calibration = "dvg_obs_ceo.v3_polishing_calibration:main"
dvg-obs-v3-polishing-result-audit = "dvg_obs_ceo.v3_polishing_result_audit:main"
dvg-obs-v4-protocol = "dvg_obs_ceo.v4_protocol:main"
dvg-obs-v4-constraint-audit = "dvg_obs_ceo.v4_constraint_audit:main"
dvg-obs-v4-composition-audit = "dvg_obs_ceo.v4_composition_audit:main"
dvg-obs-v4-joint-prediction-audit = "dvg_obs_ceo.v4_joint_prediction_audit:main"
dvg-obs-v4-search-audit = "dvg_obs_ceo.v4_search_audit:main"
dvg-obs-v4-resource-audit = "dvg_obs_ceo.v4_resource_audit:main"
dvg-obs-v4-calibration-audit = "dvg_obs_ceo.v4_calibration_audit:main"
dvg-obs-v4-lih = "dvg_obs_ceo.v4_lih:main"
dvg-obs-v4-lih-audit = "dvg_obs_ceo.v4_lih_audit:main"
dvg-obs-v4-report = "dvg_obs_ceo.v4_reporting:main"
dvg-obs-v4-release-audit = "dvg_obs_ceo.v4_release_audit:main"
dvg-obs-v4-1-protocol = "dvg_obs_ceo.v4_1_protocol:main"
dvg-obs-v4-1-failure-reproduction = "dvg_obs_ceo.v4_1_failure_reproduction:main"
dvg-obs-v4-1-semantic-audit = "dvg_obs_ceo.v4_1_semantic_audit:main"
dvg-obs-v4-1-scale-audit = "dvg_obs_ceo.v4_1_scale_audit:main"
dvg-obs-v4-1-bundle-audit = "dvg_obs_ceo.v4_1_bundle_audit:main"
dvg-obs-v4-1-multisystem = "dvg_obs_ceo.v4_1_multisystem:main"
dvg-obs-v4-1-exact-multisystem = "dvg_obs_ceo.v4_1_exact_multisystem:main"
dvg-obs-v4-1-exact-audit = "dvg_obs_ceo.v4_1_exact_audit:main"
dvg-obs-v4-1-release-audit = "dvg_obs_ceo.v4_1_release_audit:main"
dvg-obs-v5-protocol = "dvg_obs_ceo.v5_protocol:main"
dvg-obs-v5-ledger-audit = "dvg_obs_ceo.v5_ledger_audit:main"
dvg-obs-v5-nested-audit = "dvg_obs_ceo.v5_nested_audit:main"
dvg-obs-v5-sequential-audit = "dvg_obs_ceo.v5_sequential_audit:main"
dvg-obs-v5-pareto-audit = "dvg_obs_ceo.v5_pareto_audit:main"
dvg-obs-v5-hvp-kkt-audit = "dvg_obs_ceo.v5_hvp_kkt_audit:main"
dvg-obs-v5-polishing-audit = "dvg_obs_ceo.v5_conditional_polishing_audit:main"
dvg-obs-v5-multitrajectory-audit = "dvg_obs_ceo.v5_multitrajectory_audit:main"
dvg-obs-v5-release-audit = "dvg_obs_ceo.v5_release_audit:main"
dvg-obs-v5-s8-protocol = "dvg_obs_ceo.v5_s8_protocol:main"
dvg-obs-v5-s8-small-calibration = "dvg_obs_ceo.v5_s8_small_calibration:main"
dvg-obs-v5-s8-hvp-step = "dvg_obs_ceo.v5_s8_hvp_step:main"
dvg-obs-v5-s8-h4-hvp-sentinels = "dvg_obs_ceo.v5_s8_h4_hvp_sentinels:main"
dvg-obs-paper-equivalent-figures = "dvg_obs_ceo.paper_equivalent_figures:main"
dvg-obs-multisystem-checkpoint = "dvg_obs_ceo.multisystem_checkpoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:openfermion\\..*",
  "ignore::DeprecationWarning:qiskit\\..*",
  "ignore::DeprecationWarning:pyscf\\..*",
  "ignore::DeprecationWarning:numpy\\..*",
  "ignore::DeprecationWarning:adaptvqe\\..*",
  "ignore:The distutils package is deprecated.*:DeprecationWarning",
  # Python 3.10.20 promotes an invalid escape in pinned OpenFermion 1.0.1.
  # CI separately compiles first-party sources with SyntaxWarning as an error.
  "ignore:invalid escape sequence:SyntaxWarning",
]
