[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvg-obs-ceo"
version = "0.1.0.dev0"
description = "Independent DVG-aware OBS compression research extension for CEO-ADAPT-VQE"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "jsonschema==4.23.0",
  "numpy==1.23.5",
  "scipy==1.10.1",
]

[project.optional-dependencies]
baseline = [
  "openfermion==1.5.1",
  "openfermionpyscf==0.5",
  "pyscf==2.2.0",
  "qiskit==0.43.3",
]
test = [
  "pytest==8.3.5",
]

[project.scripts]
dvg-obs-baseline = "dvg_obs_ceo.baseline:main"
dvg-obs-parity = "dvg_obs_ceo.parity:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
